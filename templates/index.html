<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blazers · Survivability Assessment Grid</title>

  <link rel="icon" href="/static/favicon.ico" sizes="any">
  <link rel="icon" href="/static/brand/logo-mark.svg" type="image/svg+xml">

  <!-- Leaflet (unchanged — the grid/map logic depends on it) -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <link rel="stylesheet" href="/static/css/index.css">
</head>
<body>
  <div id="app">

    <!-- Thin vertical chevron stripe gutters (SAG-approved, fixed to viewport
         so they never add to document height / force scroll) -->
    <div class="bz-gutter bz-gutter-left" aria-hidden="true"></div>
    <div class="bz-gutter bz-gutter-right" id="bz-gutter-right" aria-hidden="true"></div>

    <!-- Header -->
    <div id="headerContainer">
      <img id="logo" src="/static/brand/logo-mark.svg" alt="Blazers" />
      <h1>Survivability Assessment Grid</h1>
    </div>

    <!-- Main: controls + table (left) | map (right) -->
    <div id="main">

      <!-- LEFT COLUMN: coordinate controls (fixed height) + table (fills rest) -->
      <div id="left-col">

        <!-- Coordinate controls -->
        <div class="panel" id="coord-panel">
          <h3>Survey Coordinates</h3>
          <form class="coord-form" onsubmit="return false;">
            <label>Research Location</label>
            <div class="coord-grid">
              <input type="text" id="location-lat" placeholder="Latitude" />
              <input type="text" id="location-long" placeholder="Longitude" />
            </div>
            <label>Study Area</label>
            <div class="coord-grid">
              <input type="text" id="study-lat" placeholder="Latitude" />
              <input type="text" id="study-long" placeholder="Longitude" />
            </div>
            <button id="generateGrid" type="button">Generate Grid</button>
          </form>

          <!-- Habitability summary chips (filled after grid generation) -->
          <div id="summary-strip"></div>
        </div>

        <!-- Sample table (fills remaining left-column height; scrolls internally) -->
        <div class="panel" id="table-panel">
          <h3>Sample Habitability</h3>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>Sample</th><th>Type</th><th>Formation</th>
                  <th>Texture</th><th>Structure</th><th>Life Support</th>
                </tr>
              </thead>
              <tbody id="table-body"></tbody>
            </table>
          </div>
        </div>

      </div>

      <!-- Map -->
      <div class="panel" id="map-panel">
        <div id="map"></div>
      </div>
    </div>

    <!-- Footer chevron band (compact, fixed height, never grows) -->
    <footer id="bz-footer">
      <div class="bz-chevron"></div>
      <div class="bz-foot-text">
        <span>BLAZERS · SURVIVABILITY ASSESSMENT GRID</span>
        <span>&copy; 2026 Blazers Software Team</span>
      </div>
    </footer>

  </div>

  <script src="/static/js/mission-context.js"></script>
  <script src="/static/js/main.js"></script>
</body>
</html>
